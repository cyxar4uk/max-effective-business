name: compose

# Проверка «как у жюри»: чистая машина, инструкция из README, одна команда.
# Требование кейса — сборка не дольше 5 минут без скачивания базовых образов.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['apps/**', 'compose*.yaml', 'deploy/**', '.env.example', 'scripts/smoke.mjs', '.github/workflows/compose.yml']

jobs:
  up:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Базовые образы (в 5 минут не входят)
        run: |
          grep -hoE '^FROM [^ ]+|image: [^ ]+' apps/*/Dockerfile compose.yaml | awk '{print $2}' | sort -u | xargs -n1 docker pull -q

      - name: .env по README
        run: |
          cp .env.example .env
          sed -i 's/^MAX_BOT_TOKEN=.*/MAX_BOT_TOKEN=ci-token/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-pass/' .env

      - name: docker compose up --build
        run: |
          start=$(date +%s)
          docker compose up -d --build --wait --wait-timeout 300
          took=$(( $(date +%s) - start ))
          echo "Сборка и запуск с нуля: ${took} с (лимит 300 с)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$took" -le 300

      - name: Smoke
        env:
          MAX_BOT_TOKEN: ci-token
        run: node scripts/smoke.mjs http://localhost:3000 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Повторный запуск без потери данных
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T db psql -U app -d app -Atc "select count(*) from users where max_user_id = 999000001" | grep -qx 1

      - name: Логи при ошибке
        if: failure()
        run: docker compose logs --tail 200

      - run: docker compose down -v
        if: always()

  # Прод-связка вживую: Caddy с HTTPS перед сервером. DOMAIN=localhost — Caddy выпускает локальный сертификат
  # своим CA вместо Let's Encrypt, остальное как на настоящем сервере.
  prod:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: .env как на сервере
        run: |
          cp .env.example .env
          sed -i 's/^MAX_BOT_TOKEN=.*/MAX_BOT_TOKEN=ci-token/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-pass/; s/^DOMAIN=.*/DOMAIN=localhost/; s/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.test/; s/^MAX_WEBHOOK_SECRET=.*/MAX_WEBHOOK_SECRET=ci_webhook_secret/' .env

      - name: docker compose (prod) up
        run: docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait --wait-timeout 300

      - name: HTTPS через Caddy
        env:
          MAX_BOT_TOKEN: ci-token
        run: |
          # HTTP → HTTPS
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/health)" = 308
          # API и подпись MAX через Caddy
          NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/smoke.mjs https://localhost | tee -a "$GITHUB_STEP_SUMMARY"
          # /bot/* доходит до сервера (ответ в формате API, а не 502 от Caddy). Без секрета — 401,
          # пока модуль бота не подключён — 404 от сервера
          body=$(curl -sk -w ' %{http_code}' -X POST https://localhost/bot/webhook -H 'Content-Type: application/json' -d '{}')
          echo "вебхук без секрета: $body"
          echo "$body" | grep -qE '"code":"(UNAUTHORIZED|NOT_FOUND)".* (401|404)$'
          # Сервер и БД наружу не опубликованы
          if curl -s --max-time 3 http://localhost:3000/api/health; then echo "сервер опубликован наружу"; exit 1; fi
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "БД опубликована наружу"; exit 1; fi
          # В журнале Caddy нет заголовков запросов (там initData)
          curl -sk -o /dev/null https://localhost/api/me -H 'X-Max-Init-Data: secret-marker-123'
          sleep 1
          if docker compose -f compose.yaml -f compose.prod.yaml logs caddy | grep -q secret-marker-123; then echo "заголовки в журнале Caddy"; exit 1; fi
          # Журнал ошибок Caddy (сервер недоступен, как при выкатке) — тоже без заголовков
          docker compose -f compose.yaml -f compose.prod.yaml stop server
          curl -sk -o /dev/null https://localhost/api/me -H 'X-Max-Init-Data: secret-marker-down'
          curl -sk -o /dev/null -X POST https://localhost/bot/webhook -H 'X-Max-Bot-Api-Secret: secret-marker-down'
          sleep 1
          docker compose -f compose.yaml -f compose.prod.yaml logs caddy | grep -q 'http.log.error' || { echo "ошибки прокси не залогированы — проверка не сработала"; exit 1; }
          if docker compose -f compose.yaml -f compose.prod.yaml logs caddy | grep -q secret-marker-down; then echo "заголовки в журнале ошибок Caddy"; exit 1; fi
          docker compose -f compose.yaml -f compose.prod.yaml start server

      - name: Логи при ошибке
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs --tail 200

      - run: docker compose -f compose.yaml -f compose.prod.yaml down -v
        if: always()

  # Вариант за чужим прокси: наш сервер на 127.0.0.1, перед ним nginx по примеру из deploy/nginx.conf.example
  behind-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: .env
        run: |
          cp .env.example .env
          sed -i 's/^MAX_BOT_TOKEN=.*/MAX_BOT_TOKEN=ci-token/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-pass/; s/^DOMAIN=.*/DOMAIN=localhost/; s/^MAX_WEBHOOK_SECRET=.*/MAX_WEBHOOK_SECRET=ci_webhook_secret/' .env
      - name: docker compose (proxy) up
        run: |
          docker network create meb-edge
          docker compose -f compose.yaml -f compose.proxy.yaml up -d --build --wait --wait-timeout 300
      - name: Сервер только на 127.0.0.1
        run: |
          docker compose -f compose.yaml -f compose.proxy.yaml ps server --format '{{.Ports}}' | tee /dev/stderr | grep -q '127.0.0.1:3000->3000'
          if docker compose -f compose.yaml -f compose.proxy.yaml ps --format '{{.Ports}}' | grep -qE '0\.0\.0\.0:|\[::\]:'; then echo "порт открыт наружу"; exit 1; fi
      - name: nginx из примера перед сервером
        env:
          MAX_BOT_TOKEN: ci-token
        run: |
          sed 's/app.example.ru/localhost/' deploy/nginx.conf.example > /tmp/site.conf
          docker run -d --name nginx --network host -v /tmp/site.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.29-alpine
          sleep 2
          docker exec nginx nginx -t
          node scripts/smoke.mjs http://localhost | tee -a "$GITHUB_STEP_SUMMARY"
      - name: nginx в контейнере через сеть meb-edge
        env:
          MAX_BOT_TOKEN: ci-token
        run: |
          sed 's/app.example.ru/localhost/; s/listen 80;/listen 8081;/' deploy/nginx-docker.conf.example > /tmp/docker-site.conf
          docker run -d --name nginx-docker --network meb-edge -p 127.0.0.1:8081:8081 -v /tmp/docker-site.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.29-alpine
          sleep 2
          docker exec nginx-docker nginx -t
          node scripts/smoke.mjs http://localhost:8081 | tee -a "$GITHUB_STEP_SUMMARY"
          # БД в общей сети не видна
          if docker exec nginx-docker getent hosts db; then echo "БД видна из сети прокси"; exit 1; fi
      - name: nginx в контейнере переживает остановку нашего сервера
        run: |
          docker compose -f compose.yaml -f compose.proxy.yaml stop server
          docker restart nginx-docker
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' nginx-docker)" = true
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health); echo "без сервера: $code"; test "$code" = 502
          docker compose -f compose.yaml -f compose.proxy.yaml start server
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/health)" = 200
      - name: Логи при ошибке
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.proxy.yaml logs --tail 100
          docker logs nginx || true
          docker logs nginx-docker || true
      - run: docker compose -f compose.yaml -f compose.proxy.yaml down -v
        if: always()
