name: server

on:
  push:
    branches: [main]
    paths: ['apps/server/**', 'compose*.yaml', 'deploy/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**', 'compose*.yaml', 'deploy/**', '.github/workflows/server.yml']

defaults:
  run:
    working-directory: apps/server

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build apps/server
        working-directory: .
      - name: compose и Caddyfile валидны
        working-directory: .
        env:
          MAX_BOT_TOKEN: ci
          POSTGRES_PASSWORD: ci
          DOMAIN: example.test
          ACME_EMAIL: ci@example.test
          MAX_WEBHOOK_SECRET: ci-secret
        run: |
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
