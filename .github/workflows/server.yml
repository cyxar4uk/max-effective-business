name: server

on:
  push:
    branches: [main]
    paths: ['apps/server/**', 'compose.yaml', '.github/workflows/server.yml']
  pull_request:
    paths: ['apps/server/**', 'compose.yaml', '.github/workflows/server.yml']

defaults:
  run:
    working-directory: apps/server

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build apps/server
        working-directory: .
