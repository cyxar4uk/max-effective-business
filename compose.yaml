# Запуск всего одной командой: docker compose up --build
# Переменные — в .env (скопировать из .env.example).

# Имя проекта фиксировано: по нему scripts/deploy.sh на общем сервере чистит только свои старые образы
name: max-effective-business

# Ротация логов Docker: иначе журнал растёт без предела (в том числе от мусорных запросов)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine3.24
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Имя уникальное: за чужим прокси сервис входит в общую с ним сеть, а Compose регистрирует там имя сервиса.
  # Обычное имя (server) перехватило бы запросы соседнего приложения, чей прокси ходит к своему «server»
  meb-server:
    build: ./apps/server
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      RUN_MIGRATIONS: "true"
      SEED_DEMO: ${SEED_DEMO:-true}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?Задайте MAX_BOT_TOKEN в .env}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      INIT_DATA_MAX_AGE_SEC: ${INIT_DATA_MAX_AGE_SEC:-86400}
      MINIAPP_URL: ${MINIAPP_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      MATCH_NOTIFY_THRESHOLD: ${MATCH_NOTIFY_THRESHOLD:-60}
      # ИИ-черновик карточки места; без ключа — по ключевым словам
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      AI_DRAFT_PER_HOUR: ${AI_DRAFT_PER_HOUR:-10}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    restart: unless-stopped

  # Мини-приложение (Илья): статика за nginx из apps/miniapp/Dockerfile. В проде /api/* и /bot/* до него
  # не доходят — их забирает прокси (Caddy или nginx сервера). Имя уникальное — по той же причине, что у meb-server
  meb-miniapp:
    build: ./apps/miniapp
    logging: *logging
    ports:
      - "${MINIAPP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
