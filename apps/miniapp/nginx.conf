server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Роутер на History API: неизвестные пути отдаём index.html, иначе перезагрузка экрана в MAX даст 404
    location / {
        try_files $uri /index.html;
    }

    # Точка входа не кешируется: после выкатки MAX сразу берёт новую версию
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Файлы сборки с хешем в имени — кешируем надолго
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
