# Прод поверх compose.yaml: HTTPS через Caddy, наружу открыты только 80 и 443; сервер и мини-приложение — за ним.
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Или scripts/deploy.sh. Переменные — в .env на сервере.

services:
  meb-server:
    # Наружу сервер не публикуем: доступ только через Caddy
    ports: !reset []
    environment:
      TRUST_PROXY: 1
      MINIAPP_URL: https://${DOMAIN:?Задайте DOMAIN в .env}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?Задайте MAX_WEBHOOK_SECRET в .env}
      SEED_DEMO: ${SEED_DEMO:-true}

  meb-miniapp:
    ports: !reset []

  caddy:
    image: caddy:2.11.4-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      meb-server:
        condition: service_healthy
      meb-miniapp:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Задайте ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
